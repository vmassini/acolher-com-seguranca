<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2f3a">
  <title>Acolher com Segurança · Ambulatório</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="hud">
      <button class="hud-btn" id="b-mapa" aria-label="Casos">☰</button>
      <div class="hud-caso"><b id="hud-titulo">Acolher com Segurança</b><small id="hud-local">Ambulatório · manejo de comportamento agitado</small></div>
      <div class="hud-tensao" id="hud-tensao" hidden>
        <span id="hud-tensao-nome">Tensão</span>
        <div class="barra"><i id="hud-tensao-barra"></i></div>
      </div>
      <div class="hud-tempo" id="hud-tempo" title="Tempo da cena" hidden>⏱ <b>0:00</b></div>
      <button class="hud-btn amarelo" id="b-ajuda" aria-label="Como jogar">?</button>
    </header>
    <main id="palco">
      <canvas id="tela"></canvas>
      <div id="sobre"></div>
      <div id="fatores" hidden></div>
      <div id="dica" hidden></div>
      <div id="flash"></div>
      <div id="toasts" aria-live="polite"></div>
    </main>
    <section id="bandeja"></section>
  </div>
  <div id="narrador" hidden aria-live="polite">
    <div class="nar-topo"><span class="nar-fase"></span><span class="nar-passo"></span></div>
    <h3 class="nar-tit"></h3>
    <div class="nar-txt"></div>
    <div class="nar-ref"></div>
    <div class="nar-ctrl">
      <button data-n="pausa">⏸ Pausar</button>
      <button data-n="prox" title="Pula a espera de leitura">⏭ Avançar</button>
      <span class="nar-vel" title="Velocidade"><button data-vel="1">1×</button><button data-vel="2">2×</button><button data-vel="4">4×</button></span>
      <button data-n="sair">Sair</button>
    </div>
    <i class="nar-barra"></i>
  </div>
  <div id="glossa" hidden></div>
  <div id="modal" class="modal oculto" role="dialog" aria-modal="true"><div class="modal-caixa" id="modal-conteudo"></div></div>
  <script type="module" src="assets/jogo.js"></script>
</body>
</html>
